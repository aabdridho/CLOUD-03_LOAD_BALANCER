
services:
  backend-a:
    build: ./backend
    image: cloud03-backend:v1
    environment:
      SERVER_ID: backend-a
    expose:
      - "8000"
    restart: unless-stopped

  backend-b:
    build: ./backend
    image: cloud03-backend:v1
    environment:
      SERVER_ID: backend-b
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-a
      - backend-b
    restart: unless-stopped
